name: Release

# Pushing a tag such as v1.0.0 builds the mod on GitHub's servers and publishes the jar as a release,
# with its SHA-256 and a link to this build log, so anyone can check where the download came from.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar)
          sha=$(sha256sum "$jar" | cut -d ' ' -f 1)
          {
            cat .github/release-notes.md
            echo
            echo "### Check the download"
            echo
            echo "- File: \`$(basename "$jar")\`"
            echo "- SHA-256: \`$sha\`"
            echo "- Built by GitHub Actions from commit ${GITHUB_SHA} ([build log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$jar" --title "CelesTech EMI Fix ${GITHUB_REF_NAME}" --notes-file notes.md
